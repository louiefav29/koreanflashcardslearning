<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - 한국어 마스터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
      /* Center the login card */
      body {
        align-items: center;
        justify-content: center;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        margin: 1rem;
      }
      /* Component Styles */
      .main-container { width: 100%; display: flex; justify-content: center; }
      .text-center { text-align: center; }
      .mb-2 { margin-bottom: 2rem; }
      .mb-1 { margin-bottom: 1rem; }
      .welcome-title { font-size: 2rem; margin-bottom: 0.5rem; }
      .subtitle { color: var(--text-secondary); }
      
      .form-group { margin-bottom: 1rem; }
      .form-group-lg { margin-bottom: 1.5rem; }
      .form-label { display: block; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; }
      .form-input { 
        width: 100%; 
        background: rgba(255, 255, 255, 0.05); 
        border: 1px solid var(--card-border-color); 
        padding: 0.75rem; 
        border-radius: 12px; 
        color: var(--text-primary); 
        outline: none; 
      }
      .forgot-password { text-align: right; margin-top: 0.5rem; }
      .link-blue { color: var(--accent-blue); font-size: 0.85rem; text-decoration: none; }
      .signup-text { font-size: 0.9rem; color: var(--text-secondary); text-align: center; }
      .link-primary { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="bubbles">
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
    </div>

    <main class="main-container">
      <section class="card login-card">
        <div class="text-center mb-2">
          <h1 class="welcome-title">Welcome Back</h1>
          <p class="subtitle">Sign in to continue learning</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" required placeholder="Enter your email" class="form-input" />
          </div>
          <div class="form-group-lg">
            <label class="form-label">Password</label>
            <input type="password" required placeholder="Enter your password" class="form-input" />
            <div class="forgot-password">
              <a href="recovery.html" class="link-blue fade-link">Forgot Password?</a>
            </div>
          </div>
          <button type="submit" class="btn mb-1" style="width: 100%">Log In</button>
          <p class="signup-text">
            Don't have an account? <a href="signup.html" class="link-primary fade-link">Sign Up</a>
          </p>
        </form>
      </section>
    </main>

    <div id="toast-container" class="toast-container" popover="manual"></div>

    <script src="js/error-handler.js"></script>
    <script src="js/ui-utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/state-manager.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
