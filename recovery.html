<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - 한국어 마스터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <style>
      body {
        align-items: center;
        justify-content: center;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        margin: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="bubbles">
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
    </div>

    <main style="width: 100%; display: flex; justify-content: center;">
      <section class="card login-card">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Reset Password</h1>
          <p style="color: var(--text-secondary);">Recover your account access</p>
        </div>

        <form onsubmit="handleRecovery(event)">
          <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center;">
            Enter your email address and we'll send you a link to reset your password.
          </p>
          <div style="margin-bottom: 1.5rem">
            <label style="display: block; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem">Email</label>
            <input type="email" required placeholder="Enter your email" style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border-color); padding: 0.75rem; border-radius: 12px; color: var(--text-primary); outline: none;" />
          </div>
          <button type="submit" class="btn" style="width: 100%; margin-bottom: 1rem">Send Recovery Link</button>
          <p style="font-size: 0.9rem; color: var(--text-secondary); text-align: center">
            <a href="login.html" style="color: var(--text-secondary); text-decoration: none;">Back to Login</a>
          </p>
        </form>
      </section>
    </main>

    <script src="js/logger.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        requestAnimationFrame(() => {
          document.body.classList.add("loaded");
        });
      });

      function handleRecovery(event) {
        event.preventDefault();
        alert('Recovery email sent!');
        document.body.classList.remove("loaded");
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 500);
      }
    </script>
  </body>
</html>
